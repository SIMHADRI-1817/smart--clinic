<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Analytics | CureConnect Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar-blue">
        <div class="sidebar-brand">
            <i class="fa-solid fa-circle-info"></i>
            <span>Admin Panel</span>
        </div>

        <nav class="sidebar-menu">
            <a href="{{ url_for('admin') }}" class="menu-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="{{ url_for('analytics1') }}" class="menu-item active">
                <i class="fa-solid fa-chart-pie"></i>
                <span>User Activity</span>
            </a>
            <a href="{{ url_for('analytics2') }}" class="menu-item">
                <i class="fa-solid fa-chart-bar"></i>
                <span>Doctor Ratings</span>
            </a>
            <a href="{{ url_for('manage_clinics') }}" class="menu-item">
                <i class="fa-solid fa-hospital"></i>
                <span>Manage Clinics</span>
            </a>
            <a href="{{ url_for('manage_users') }}" class="menu-item">
                <i class="fa-solid fa-users"></i>
                <span>Manage Users</span>
            </a>
        </nav>

        <div class="sidebar-logout">
            <a href="{{ url_for('logout') }}" class="menu-item">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">
        <!-- Top Bar -->
        <div class="admin-topbar">
            <h1>User Activity Analytics</h1>
            <div class="topbar-actions">
                <div class="date-range-picker">
                    <i class="fa-solid fa-calendar"></i> Last 7 Days
                </div>
            </div>
        </div>

        <!-- Stats Overview -->
        <div class="stats-cards-grid">
            <div class="stat-card-new blue-border">
                <div class="stat-icon blue">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-number">{{ total_users }}</div>
                    <div class="stat-trend positive">
                        <i class="fa-solid fa-arrow-up"></i> 12% vs last week
                    </div>
                </div>
            </div>

            <div class="stat-card-new green-border">
                <div class="stat-icon green">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Total Appointments</div>
                    <div class="stat-number">{{ counts|sum }}</div>
                    <div class="stat-trend positive">
                        <i class="fa-solid fa-arrow-up"></i> 5% vs last week
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="charts-grid">
            <!-- Appointments Trend Chart -->
            <div class="chart-card full-width">
                <div class="chart-header">
                    <h3>Appointments Overview</h3>
                    <div class="chart-actions">
                        <a href="{{ url_for('analytics1', range='week') }}"
                            class="chart-btn {{ 'active' if time_range == 'week' else '' }}">Week</a>
                        <a href="{{ url_for('analytics1', range='month') }}"
                            class="chart-btn {{ 'active' if time_range == 'month' else '' }}">Month</a>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="appointmentsChart"></canvas>
                </div>
            </div>

            <!-- Status Distribution Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <h3>Appointment Status</h3>
                </div>
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

            <!-- User Growth Chart (Mock) -->
            <div class="chart-card">
                <div class="chart-header">
                    <h3>User Growth</h3>
                </div>
                <div class="chart-container">
                    <canvas id="userGrowthChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script>
        (function () {
            // Data from Flask
            const dates = {{ dates| tojson
        }};
        const counts = {{ counts| tojson }};
        const statusData = {{ status_data| tojson }};

        // 1. Appointments Line Chart
        const ctxAppt = document.getElementById('appointmentsChart').getContext('2d');
        new Chart(ctxAppt, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [{
                    label: 'Appointments',
                    data: counts,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#3b82f6',
                    pointBorderWidth: 2,
                    pointRadius: 4,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        backgroundColor: 'rgba(255, 255, 255, 0.9)',
                        titleColor: '#1f2937',
                        bodyColor: '#4b5563',
                        borderColor: '#e5e7eb',
                        borderWidth: 1,
                        padding: 10,
                        displayColors: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#f3f4f6'
                        },
                        ticks: {
                            stepSize: 1
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });

        // 2. Status Pie Chart
        const ctxStatus = document.getElementById('statusChart').getContext('2d');
        new Chart(ctxStatus, {
            type: 'doughnut',
            data: {
                labels: Object.keys(statusData),
                datasets: [{
                    data: Object.values(statusData),
                    backgroundColor: [
                        '#10b981', // Completed (Green)
                        '#f59e0b', // Pending (Orange)
                        '#ef4444', // Cancelled (Red)
                        '#3b82f6'  // Checked In (Blue)
                    ],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            usePointStyle: true,
                            padding: 20
                        }
                    }
                },
                cutout: '70%'
            }
        });

        // 3. User Growth Bar Chart (Mock Data)
        const ctxGrowth = document.getElementById('userGrowthChart').getContext('2d');
        new Chart(ctxGrowth, {
            type: 'bar',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'New Users',
                    data: [12, 19, 15, 25, 22, 30, 28], // Mock data
                    backgroundColor: '#8b5cf6',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#f3f4f6'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
        }) ();
    </script>
</body>

</html>
