<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CureConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .auth-icon {
            font-size: 48px;
            color: #0ea5e9;
            margin-bottom: 20px;
        }
    </style>
</head>

<body style="background-color: #f0f9ff;">
    <div class="auth-container">
        <div class="auth-icon">
            <i class="fa-solid fa-key"></i>
        </div>
        <h2 style="margin-bottom: 10px; color: #2c3e50;">New Password</h2>
        <p style="color: #7f8c8d; margin-bottom: 30px;">
            Please enter your new password below.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}" style="margin-bottom: 20px; text-align: left;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password_new') }}">
            <div class="form-group" style="text-align: left;">
                <label>New Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                Reset Password
            </button>
        </form>
    </div>
</body>

</html>
