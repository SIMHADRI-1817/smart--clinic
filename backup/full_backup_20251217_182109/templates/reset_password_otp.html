<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Reset Code | CureConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .auth-icon {
            font-size: 48px;
            color: #0ea5e9;
            margin-bottom: 20px;
        }

        .otp-input {
            letter-spacing: 8px;
            font-size: 24px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body style="background-color: #f0f9ff;">
    <div class="auth-container">
        <div class="auth-icon">
            <i class="fa-solid fa-envelope-open-text"></i>
        </div>
        <h2 style="margin-bottom: 10px; color: #2c3e50;">Verify Code</h2>
        <p style="color: #7f8c8d; margin-bottom: 30px;">
            Enter the 6-digit code sent to your email.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}" style="margin-bottom: 20px; text-align: left;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password_otp') }}">
            <div class="form-group">
                <input type="text" name="otp" class="form-control otp-input" placeholder="000000" maxlength="6" required
                    pattern="\d{6}" title="Please enter the 6-digit code">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                Verify Code
            </button>
        </form>

        <div style="margin-top: 20px; font-size: 14px;">
            <a href="{{ url_for('forgot_password') }}" style="color: #7f8c8d; text-decoration: none;">
                Resend Code
            </a>
        </div>
    </div>
</body>

</html>
